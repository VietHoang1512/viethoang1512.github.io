
          <div class="publications">
            <h2>selected publications</h2>
            <p class="text-muted mb-0">(*) denotes equal contribution</p>
            {%- for y in page.years %}
            <div class="year-group">
              <h2 class="year">{{ y }}</h2>
              {% bibliography -f papers -q @*[selected=true,year={{ y }}]* %}
            </div>
            {%- endfor %}
          </div>
